[project]
name = "errhub"
version = "1.0.0"
description = "ErrHub - Exception Collection & Management Platform"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "flask-cors==6.0.2",
    "psycopg2-binary==2.9.12",
    "redis==8.0.0",
    "gunicorn==26.0.0",
    "pyjwt==2.13.0",
    "werkzeug==3.1.8",
    "pillow>=10.0.0",
    "celery[redis]>=5.3.0",
    "croniter>=1.4.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = []
