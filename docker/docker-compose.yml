name: errhub

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-errhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errhub}
      POSTGRES_DB: ${POSTGRES_DB:-errhub}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    ports:
      - "5454:5432"
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    ports:
      - "6363:6379"
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-errhub}:${POSTGRES_PASSWORD:-errhub}@db:5432/${POSTGRES_DB:-errhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin123}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run flask init-db && uv run gunicorn --bind 0.0.0.0:5000 --workers $${GUNICORN_WORKERS:-4} --timeout 120 run:app"
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-errhub}:${POSTGRES_PASSWORD:-errhub}@db:5432/${POSTGRES_DB:-errhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A celery_worker.celery worker --loglevel=info --concurrency=4
    restart: unless-stopped

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-errhub}:${POSTGRES_PASSWORD:-errhub}@db:5432/${POSTGRES_DB:-errhub}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A celery_worker.celery beat --loglevel=info
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
